name: Semver Tag

on:
  workflow_call:
    inputs:
      initial-tag:
        description: "Tag to create when the repository has no existing v*.*.* tags"
        required: false
        type: string
        default: "v0.1.0"
      push-tag:
        description: "Create and push the computed tag to origin"
        required: false
        type: boolean
        default: true
    secrets:
      RELEASE_TOKEN:
        description: "Optional PAT or GitHub App token so tag pushes trigger downstream tag workflows (defaults to github.token)"
        required: false
    outputs:
      tag:
        description: "Computed vX.Y.Z tag, or empty string when skipped"
        value: ${{ jobs.tag.outputs.tag }}
      bump:
        description: "Detected bump level: major, minor, patch, or none"
        value: ${{ jobs.tag.outputs.bump }}
      skipped:
        description: "Whether tagging was skipped ('true' or 'false')"
        value: ${{ jobs.tag.outputs.skipped }}

permissions:
  contents: write

jobs:
  tag:
    name: Compute and push semver tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Compute next version from conventional commits
        id: version
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          INITIAL_TAG: ${{ inputs.initial-tag }}
        run: |
          set -euo pipefail

          if grep -Fq '[skip release]' <<<"$HEAD_MSG"; then
            echo "Head commit contains [skip release]; skipping"
            {
              echo "tag="
              echo "bump=none"
              echo "skipped=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "No existing tag found; starting at ${INITIAL_TAG}"
            {
              echo "tag=${INITIAL_TAG}"
              echo "bump=initial"
              echo "skipped=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          range="${latest}..HEAD"
          subjects=$(git log "$range" --format='%s')
          bodies=$(git log "$range" --format='%b')

          bump="none"
          if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" || grep -qiE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump="major"
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then
            bump="minor"
          elif grep -qE '^(fix|perf)(\([^)]+\))?:' <<<"$subjects"; then
            bump="patch"
          fi

          if [ "$bump" = "none" ]; then
            echo "No feat/fix/perf/breaking commits since ${latest}; skipping release"
            {
              echo "tag="
              echo "bump=none"
              echo "skipped=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "Computed ${next} (${bump} bump from ${latest})"
          {
            echo "tag=${next}"
            echo "bump=${bump}"
            echo "skipped=false"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: inputs.push-tag && steps.version.outputs.skipped != 'true' && steps.version.outputs.tag != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
