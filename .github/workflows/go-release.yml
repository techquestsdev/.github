name: Go Release

on:
  workflow_call:
    inputs:
      go-version-file:
        description: "Path to go.mod or .go-version used to select the Go toolchain"
        required: false
        type: string
        default: "go.mod"
      build-tags:
        description: "Optional comma-separated Go build tags passed to pre-release tests"
        required: false
        type: string
        default: ""
      run-tests:
        description: "Run 'go test -race ./...' before tagging and running GoReleaser"
        required: false
        type: boolean
        default: true
      initial-tag:
        description: "Tag to create when the repository has no existing v*.*.* tags"
        required: false
        type: string
        default: "v0.1.0"
      tag:
        description: "Explicit existing tag to release (leave empty to compute and push from conventional commits)"
        required: false
        type: string
        default: ""
      goreleaser-version:
        description: "GoReleaser version constraint"
        required: false
        type: string
        default: "~> v2"
      goreleaser-args:
        description: "Arguments passed to GoReleaser"
        required: false
        type: string
        default: "release --clean"
    secrets:
      HOMEBREW_TOKEN:
        description: "PAT with push access to techquestsdev/homebrew-tap"
        required: false
      RELEASE_TOKEN:
        description: "Optional PAT or GitHub App token used for tag creation and GitHub Releases (defaults to github.token)"
        required: false

permissions:
  contents: write

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created_new: ${{ steps.version.outputs.created_new }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Resolve or compute next semver tag
        id: version
        env:
          EXPLICIT_TAG: ${{ inputs.tag }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          INITIAL_TAG: ${{ inputs.initial-tag }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT_TAG" ]; then
            echo "Using explicit tag ${EXPLICIT_TAG}"
            {
              echo "tag=${EXPLICIT_TAG}"
              echo "created_new=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fq '[skip release]' <<<"$HEAD_MSG"; then
            echo "Head commit contains [skip release]; skipping release"
            {
              echo "tag="
              echo "created_new=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "No existing tag found; starting at ${INITIAL_TAG}"
            {
              echo "tag=${INITIAL_TAG}"
              echo "created_new=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          range="${latest}..HEAD"
          subjects=$(git log "$range" --format='%s')
          bodies=$(git log "$range" --format='%b')

          bump="none"
          if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" || grep -qiE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump="major"
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then
            bump="minor"
          elif grep -qE '^(fix|perf)(\([^)]+\))?:' <<<"$subjects"; then
            bump="patch"
          fi

          if [ "$bump" = "none" ]; then
            echo "No feat/fix/perf/breaking commits since ${latest}; skipping release"
            {
              echo "tag="
              echo "created_new=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "Computed ${next} (${bump} bump from ${latest})"
          {
            echo "tag=${next}"
            echo "created_new=true"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.created_new == 'false' && needs.version.outputs.tag || '' }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run pre-release tests
        if: inputs.run-tests
        env:
          BUILD_TAGS: ${{ inputs.build-tags }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD_TAGS" ]; then
            go test -race "-tags=${BUILD_TAGS}" ./...
          else
            go test -race ./...
          fi

      - name: Create and push tag
        if: needs.version.outputs.created_new == 'true'
        env:
          NEW_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "Tag ${NEW_TAG} already exists on origin; skipping tag creation"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
